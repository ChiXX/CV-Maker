[project]
name = "cv-maker"
version = "0.1.0"
description = "CV Maker application"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "beautifulsoup4==4.13.4",
    "certifi==2025.6.15",
    "charset-normalizer==3.4.2",
    "fastapi==0.115.6",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.10",
    "jiter==0.10.0",
    "openai==1.93.0",
    "packaging==25.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.11.7",
    "pydantic_core==2.33.2",
    "pytest==8.3.3",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "requests==2.32.4",
    "sniffio==1.3.1",
    "soupsieve==2.7",
    "SQLAlchemy==2.0.30",
    "starlette==0.41.3",
    "typing_extensions==4.14.0",
    "urllib3==2.5.0",
    "uvicorn==0.32.1",
    "alembic==1.14.0",
]

[project.scripts]
cv-maker = "app:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
