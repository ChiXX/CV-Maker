version: '3.8'

services:
  # Lightweight PostgreSQL for low-memory environments
  postgres:
    image: postgres:15-alpine
    container_name: cv_maker_db_dev
    environment:
      POSTGRES_DB: cv_maker
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: cv_password
      # Optimize for low memory
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAINTENANCE_WORK_MEM: 32MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Disable healthcheck to reduce resource usage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_maker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Memory limits for low-resource environments
    deploy:
      resources:
        limits:
          memory: 256MB
        reservations:
          memory: 128MB

  # Optimized API service
  api:
    build: .
    container_name: cv_maker_api_dev
    environment:
      DATABASE_URL: postgresql://cv_user:cv_password@postgres:5432/cv_maker
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-mistralai/mistral-small-3.1-24b-instruct:free}
      NAME: ${NAME:-Your Name}
      # Memory optimization
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "8000:8000"
    volumes:
      # Minimal volume mounts for development
      - ./app.py:/app/app.py
      - ./cl_generator.py:/app/cl_generator.py
      - ./cv_generator.py:/app/cv_generator.py
      - ./jd_generator.py:/app/jd_generator.py
      - ./database.py:/app/database.py
      - ./models.py:/app/models.py
      - ./prompts.py:/app/prompts.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    user: root
    # Optimized command for low memory
    command: python -m uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1 --loop asyncio --http httptools --ws websockets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    # Memory limits
    deploy:
      resources:
        limits:
          memory: 512MB
        reservations:
          memory: 256MB

  # Keep frontend as-is since it's already optimized
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cv_maker_frontend_dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    # Memory limits for frontend
    deploy:
      resources:
        limits:
          memory: 256MB
        reservations:
          memory: 128MB

volumes:
  postgres_data:
