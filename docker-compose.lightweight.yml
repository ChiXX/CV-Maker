version: '3.8'

services:
  # 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: cv_maker_db_light
    environment:
      POSTGRES_DB: cv_maker
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: cv_password
    command: >
      postgres 
      -c max_connections=20 
      -c shared_buffers=32MB 
      -c work_mem=4MB 
      -c maintenance_work_mem=8MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_maker"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  api:
    build: ./backend  # 在服务器本地构建
    container_name: cv_maker_api_light
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://cv_user:cv_password@postgres:5432/cv_maker
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "2053:8000" 
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "/app/.venv/bin/python /app/scripts/init_db.py && /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"
    deploy:
      resources:
        limits:
          memory: 256M

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=https://tycoola.edu.kg:2053
    container_name: cv_maker_frontend
    ports:
      - "80:3000" 
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M # 给构建预留稍多内存

volumes:
  postgres_data: