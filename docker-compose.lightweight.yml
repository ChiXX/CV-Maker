version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cv_maker_db_light
    # ... 保持你之前的数据库配置不变 ...

  api:
    build: .
    container_name: cv_maker_api_light
    environment:
      DATABASE_URL: postgresql://cv_user:cv_password@postgres:5432/cv_maker
      # ... 其他环境变量 ...
    ports:
      - "2053:8000"  # 👈 后端改到 Cloudflare 支持的 2053 端口
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend # 假设你的前端 Dockerfile 叫这个名字
    container_name: cv_maker_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://tycoola.edu.kg:2053 # 👈 指向带端口的 API 地址
    ports:
      - "80:3000" # 👈 前端占用 80 端口
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384MB # 严格限制前端内存