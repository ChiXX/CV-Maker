version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cv_maker_db
    environment:
      POSTGRES_DB: cv_maker
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: cv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_maker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cv_maker_api
    environment:
      DATABASE_URL: postgresql://cv_user:cv_password@postgres:5432/cv_maker
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-mistralai/mistral-small-3.1-24b-instruct:free}
      NAME: ${NAME:-Your Name}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
